[project]
name = "chisellmfv"
version = "0.1.0"
description = "Direct property authoring, formal verification, and causal diagnosis for Chisel"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "ISCAS" },
]
keywords = ["chisel", "formal-verification", "llm", "hardware-verification", "jaspergold"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

dependencies = [
    "requests>=2.31.0",
    "tiktoken>=0.4.0",
    "pylibfst>=0.2.1",
]

[project.optional-dependencies]
causal = [
    "graphviz>=0.20",
    "hdlConvertor>=2.3",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.scripts]
chisellmfv = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
# uv workspace configuration. The project is managed entirely by uv; run:
#   uv sync            # install dependencies into .venv/
#   uv run python main.py formal --help
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
